<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="40" cy="40" r="1.5" fill="#334155" opacity="0.6"/>
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes scanline {
        0% { transform: translateY(-400px); }
        100% { transform: translateY(400px); }
      }
      @keyframes dashFlow {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes shieldPulse {
        0%, 100% { filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.4)); }
        50% { filter: drop-shadow(0 0 20px rgba(239, 68, 68, 0.8)); }
      }
      .pulsing-orb {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: center;
      }
      .floating-card {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .hazard-stream {
        stroke-dasharray: 12, 12;
        animation: dashFlow 20s linear infinite;
      }
      .shield-icon {
        animation: shieldPulse 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="100" r="180" fill="#f59e0b" opacity="0.08" filter="url(#glowGold)" class="pulsing-orb"/>
  <circle cx="1000" cy="300" r="220" fill="#06b6d4" opacity="0.08" filter="url(#glowCyan)" class="pulsing-orb" style="animation-delay: -3s;"/>
  <circle cx="600" cy="200" r="150" fill="#ef4444" opacity="0.05" class="pulsing-orb" style="animation-delay: -1.5s;"/>

  <!-- Industrial Tech Accent Lines -->
  <path d="M 0,80 L 300,80 L 360,140 L 840,140 L 900,80 L 1200,80" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6"/>
  <path d="M 0,340 L 260,340 L 320,280 L 880,280 L 940,340 L 1200,340" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6"/>
  <path d="M 100,0 L 100,400 M 1100,0 L 1100,400" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.2" class="hazard-stream"/>

  <!-- Top Status Bar / Category Pill -->
  <g transform="translate(420, 35)">
    <rect x="0" y="0" width="360" height="32" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" opacity="0.9"/>
    <circle cx="18" cy="16" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="21" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">CONTROL OF WORK &amp; EHS ECOSYSTEM</text>
  </g>

  <!-- Central Header Content -->
  <g transform="translate(100, 100)">
    <!-- Permit Shield Icon -->
    <g transform="translate(40, 25)" class="shield-icon">
      <polygon points="45,5 85,20 85,65 45,95 5,65 5,20" fill="#1e293b" stroke="url(#primaryGrad)" stroke-width="3.5"/>
      <!-- Safety Checkmark / Lock Inside -->
      <path d="M 28,48 L 40,60 L 64,34" fill="none" stroke="#10b981" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="45" cy="50" r="32" fill="none" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4,4"/>
    </g>

    <!-- Main Title -->
    <text x="160" y="62" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome <tspan fill="url(#primaryGrad)">Permit-to-Work</tspan>
    </text>

    <text x="162" y="102" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" letter-spacing="0.2">
      Curated SaaS Platforms, Control of Work &amp; Open-Source Safety Architectures
    </text>

    <!-- Feature Badges -->
    <g transform="translate(162, 130)">
      <!-- Badge 1: Hot Work & Confined Space -->
      <rect x="0" y="0" width="165" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="19" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ Hot Work &amp; Confined</text>

      <!-- Badge 2: LOTO & Isolation -->
      <rect x="175" y="0" width="160" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="189" y="19" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🔒 LOTO &amp; Isolations</text>

      <!-- Badge 3: Digital Approvals -->
      <rect x="345" y="0" width="160" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="359" y="19" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">✍️ Multi-Stage Signoff</text>

      <!-- Badge 4: SIMOPS & CoW -->
      <rect x="515" y="0" width="145" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="529" y="19" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🌐 SIMOPS &amp; Audits</text>
    </g>
  </g>

  <!-- Right Floating Metric Cards -->
  <g transform="translate(900, 115)" class="floating-card">
    <!-- Card 1: Open Source & Enterprise -->
    <rect x="0" y="0" width="230" height="74" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)"/>
    <rect x="14" y="16" width="42" height="42" rx="8" fill="#1e293b"/>
    <text x="25" y="44" fill="#f59e0b" font-size="20">📜</text>
    <text x="68" y="34" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Digital Permits</text>
    <text x="68" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">SaaS &amp; Self-Hosted</text>

    <!-- Card 2: Risk & Compliance -->
    <g transform="translate(0, 90)">
      <rect x="0" y="0" width="230" height="74" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)"/>
      <rect x="14" y="16" width="42" height="42" rx="8" fill="#1e293b"/>
      <text x="25" y="44" fill="#10b981" font-size="20">🛡️</text>
      <text x="68" y="34" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">EHS Compliance</text>
      <text x="68" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">OSHA • ISO 45001</text>
    </g>
  </g>

  <!-- Bottom Accent Stripe -->
  <rect x="0" y="394" width="1200" height="6" fill="url(#primaryGrad)"/>
</svg>
